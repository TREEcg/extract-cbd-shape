name: Benchmark for extraction algorithm
on:
  push:
    branches:
      - main
permissions:
  contents: write
  deployments: write

jobs:
  benchmark-inband:
    name: Benchmark for extraction algorithm (inband)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm run build --if-present
      - run: node ./perf/perftest-inband.js | tee output.txt
      
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
            name: Extraction algorithm Benchmark for inband data
            tool: 'benchmarkjs'
            output-file-path: output.txt
            github-token: ${{ secrets.GITHUB_TOKEN }}
            benchmark-data-dir-path: docs/
            auto-push: true
            # Show alert with commit comment on detecting possible performance regression
            alert-threshold: '25%'
            comment-on-alert: true
            fail-on-alert: true
            alert-comment-cc-users: '@xdxxxdx'

  benchmark-inband-diskstore:
    name: Benchmark for extraction algorithm (inband with diskstore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm run build --if-present
      - run: node ./perf/perftest-inband-diskstore.js | tee output.txt
      
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
            name: Extraction algorithm Benchmark for inband data with diskstore
            tool: 'benchmarkjs'
            output-file-path: output.txt
            github-token: ${{ secrets.GITHUB_TOKEN }}
            benchmark-data-dir-path: docs/
            auto-push: true
            # Show alert with commit comment on detecting possible performance regression
            alert-threshold: '25%'
            comment-on-alert: true
            fail-on-alert: true
            alert-comment-cc-users: '@julianrojas87'

  benchmark-page:
    name: Benchmark for page extraction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm run build --if-present
      - run: node ./perf/perftest-page.js | tee output.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
            name: Extraction algorithm benchmark for member pages
            tool: 'benchmarkjs'
            output-file-path: output.txt
            github-token: ${{ secrets.GITHUB_TOKEN }}
            benchmark-data-dir-path: docs/
            auto-push: true
            alert-threshold: '25%'
            comment-on-alert: true
            fail-on-alert: true
            alert-comment-cc-users: '@julianrojas87'
