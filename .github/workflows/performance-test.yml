name: Performance comparison

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-with-previous-tag:
    name: Compare all benchmarks with the previous tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out current revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Find previous tag
        id: previous-tag
        run: node ./perf/find-previous-tag.js

      - name: Check out previous tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.previous-tag.outputs.tag }}
          path: perf/comparison/previous-tag

      - name: Install current dependencies
        run: npm ci

      - name: Install previous-tag dependencies
        working-directory: perf/comparison/previous-tag
        run: npm ci

      - name: Build current revision
        run: npm run build

      - name: Build previous tag
        working-directory: perf/comparison/previous-tag
        run: npm run build

      - name: Benchmark current revision
        env:
          BENCHMARK_RESULTS_DIR: ${{ github.workspace }}/perf/comparison/current
        run: npm run bench:run

      - name: Benchmark previous tag
        env:
          BENCHMARK_RESULTS_DIR: ${{ github.workspace }}/perf/comparison/previous
          EXTRACT_CBD_SHAPE_DIST: ${{ github.workspace }}/perf/comparison/previous-tag/dist/lib
        run: npm run bench:run

      - name: Compare results
        env:
          BASELINE_TAG: ${{ steps.previous-tag.outputs.tag }}
          CURRENT_RESULTS_DIR: ${{ github.workspace }}/perf/comparison/current
          CURRENT_REVISION: ${{ github.sha }}
          PERFORMANCE_REGRESSION_RATIO: "1.25"
          PERFORMANCE_REPORT: ${{ github.workspace }}/perf/results/performance-comparison.md
          PREVIOUS_RESULTS_DIR: ${{ github.workspace }}/perf/comparison/previous
        run: node ./perf/compare-results.js

      - name: Add report to job summary
        if: always() && hashFiles('perf/results/performance-comparison.md') != ''
        run: cat ./perf/results/performance-comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance report
        if: always() && hashFiles('perf/results/performance-comparison.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: performance-comparison
          path: perf/results/performance-comparison.md
