name: Playground

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            perf/web/package-lock.json

      - name: Install library dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Install playground dependencies
        run: npm ci --prefix perf/web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build playground
        run: npm run build --prefix perf/web
        env:
          BASE_PATH: /extract-cbd-shape

      - name: Upload playground
        uses: actions/upload-pages-artifact@v4
        with:
          path: perf/web/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy playground
        id: deployment
        uses: actions/deploy-pages@v4
